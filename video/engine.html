<!doctype html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Geist',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;background:#0E1A33;color:#fff}
#g{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(42,91,215,.5),transparent 66%)}
.top{position:absolute;left:84px;top:84px;display:flex;align-items:center;gap:16px;font-size:44px;font-weight:600;letter-spacing:-.03em;z-index:5}
.logo{width:64px;height:64px;border-radius:16px;background:#2A5BD7;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700}
.sc{position:absolute;left:84px;right:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:34px;opacity:0}
.tag{align-self:flex-start;padding:14px 26px;border-radius:99px;font-size:30px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.08);color:#BFD0F7;border:1.5px solid rgba(191,208,247,.3)}
.tag.red{background:rgba(214,90,98,.18);color:#F2A6AB;border-color:rgba(242,166,171,.35)}.tag.grn{background:rgba(31,157,107,.2);color:#8FE0BC;border-color:rgba(143,224,188,.35)}
h1{font-size:128px;line-height:1.03;font-weight:600;letter-spacing:-.045em}h1.m{font-size:104px}h1.s{font-size:84px;line-height:1.08;letter-spacing:-.04em}
h1 em{font-style:normal;color:#93AEF0}
.sub{font-size:48px;line-height:1.4;color:#A3B1CC}
.hid{opacity:0}
.row{display:flex;align-items:center;gap:30px;background:rgba(255,255,255,.06);border:1.5px solid rgba(191,208,247,.18);border-radius:36px;padding:38px 44px}
.n{flex:none;width:84px;height:84px;border-radius:24px;background:#2A5BD7;font-size:46px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rt .t{font-size:50px;font-weight:600;letter-spacing:-.03em;line-height:1.1}.rt .d{font-size:34px;color:#A3B1CC;margin-top:8px;line-height:1.3}
.cta{align-self:flex-start;font-size:48px;font-weight:600;padding:30px 48px;border-radius:99px;background:#2A5BD7}
.strike{text-decoration:line-through;text-decoration-thickness:8px;text-decoration-color:#F2A6AB}
.sc.chat{justify-content:flex-start;padding-top:230px}.sc.chat h1{font-size:76px}.panel{background:#F6F7F9;border-radius:44px;padding:40px 40px;display:flex;flex-direction:column;gap:22px;color:#1B2437;height:1320px;overflow:hidden}
.u{align-self:flex-end;background:#2A5BD7;color:#fff;font-size:46px;padding:24px 36px;border-radius:40px 40px 10px 40px;max-width:800px}
.b{align-self:flex-start;background:#fff;border:1.5px solid #E9ECF1;border-radius:10px 40px 40px 40px;padding:28px 36px;font-size:42px;line-height:1.5;color:#1B2437;min-width:560px}
.card{display:flex;align-items:center;gap:26px}.ic{width:96px;height:96px;border-radius:26px;background:#EDF2FD;display:flex;align-items:center;justify-content:center;font-size:52px}
.nm{font-size:46px;font-weight:600;color:#0E1A33}.ct{font-size:30px;color:#5E6679;margin-top:6px}.am{margin-left:auto;padding-left:30px;font-size:50px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}.am.r{color:#C8464F}.am.g{color:#13875B}
.sum .t{font-size:30px;color:#13875B;font-weight:600;margin-bottom:12px}.sum div.l{display:flex;justify-content:space-between;gap:60px;padding:6px 0}.sum .tot{border-top:1.5px solid #E9ECF1;margin-top:10px;padding-top:20px;font-size:48px}
.btns{display:flex;gap:20px;align-self:flex-start}.btns span{background:#fff;border:1.5px solid #E9ECF1;border-radius:24px;padding:20px 32px;font-size:36px;font-weight:600;color:#1B2437}.caret{display:inline-block;width:2px;height:46px;background:#fff;vertical-align:middle;margin-left:2px}
</style>
<div id="g"></div><div class="top"><div class="logo">W</div>Wally</div><div id="root"></div>
<script>
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),4),io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},sg=(t,a,b)=>cl((t-a)/(b-a));
let SC=[],TOTAL=0;
function build(spec){
  const root=document.getElementById('root');let T=0;
  spec.scenes.forEach((s,i)=>{
    const el=document.createElement('div');el.className='sc';let h='',d=0,els=[];const add=(html,a)=>{h+=html.replace('<','<').replace(/^<(\w+)/,`<$1 data-a="${a}"`)};
    if(s.type=='hook'){add(`<div class="tag${s.cls?' '+s.cls:''}">${s.tag||''}</div>`,.1);add(`<h1 class="${s.size||''}">${s.title}</h1>`,.35);if(s.sub)add(`<div class="sub">${s.sub}</div>`,1.0);d=s.dur||3.2}
    else if(s.type=='items'){add(`<div class="tag">${s.tag||'Dica'}</div>`,.1);add(`<h1 class="s">${s.title}</h1>`,.3);let a=1.3;s.items.forEach((it,k)=>{add(`<div class="row"><div class="n">${k+1}</div><div class="rt"><div class="t">${it[0]}</div><div class="d">${it[1]}</div></div></div>`,a);a+=1.5});d=a+1.2}
    else if(s.type=='myth'){add(`<div class="tag red">Mito</div>`,.1);add(`<h1 class="s myth" data-strike="${s.strikeAt||2.6}">${s.myth}</h1>`,.3);add(`<div class="tag grn">Verdade</div>`,3.0);add(`<h1 class="s">${s.truth}</h1>`,3.3);if(s.sub)add(`<div class="sub">${s.sub}</div>`,4.4);d=(s.sub?4.4:3.6)+2.6}
    else if(s.type=='chat'){add(`<div class="tag">${s.tag||'Telegram'}</div>`,.1);add(`<h1 class="s">${s.title}</h1>`,.3);let a=1.4,inner='';
      s.msgs.forEach(m=>{if(m.u){inner+=`<div class="u" data-a="${a}" data-type="${m.u}" data-b="${a+.9}"></div>`;a+=1.3}else if(m.card){const c=m.card;inner+=`<div class="b" data-a="${a}"><div class="card"><div class="ic">${c.icon}</div><div><div class="nm">${c.name}</div><div class="ct">${c.cat}</div></div><div class="am ${c.inc?'g':'r'}">${c.inc?'+':'–'} R$ ${c.amt}</div></div></div>`;a+=1.4}else if(m.bot){inner+=`<div class="b" data-a="${a}" style="font-size:36px;line-height:1.5">${m.bot}</div>`;a+=m.t||1.9}else if(m.btns){inner+=`<div class="btns" data-a="${a}">${m.btns.map(b=>`<span>${b}</span>`).join('')}</div>`;a+=1.0}else if(m.sum){inner+=`<div class="b sum" data-a="${a}"><div class="t">📊 Resumo do mês</div>${m.sum.map(r=>`<div class="l ${r[2]||''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;a+=1.6}});
      h+=`<div class="panel">${inner}</div>`;d=a+.8}
    else if(s.type=='outro'){add(`<h1 class="m">${s.title}</h1>`,.2);add(`<div class="sub">${s.sub||'Crie sua conta grátis. Link na bio.'}</div>`,.9);add(`<div class="cta">@wally_financeiro</div>`,1.4);d=s.dur||3.6}
    if(s.type=='chat')el.classList.add('chat');el.innerHTML=h;root.appendChild(el);SC.push({el,start:T,dur:d,last:i==spec.scenes.length-1});T+=d-.2
  });TOTAL=T+.2;return TOTAL}
function render(t){
  const g=document.getElementById('g');g.style.left=(500+Math.sin(t*.5)*120)+'px';g.style.top=(-300+Math.cos(t*.4)*90)+'px';
  SC.forEach(s=>{const l=t-s.start;const vis=l>-.1&&l<s.dur+.1;s.el.style.display=vis?'flex':'none';if(!vis)return;
    const fin=eo(sg(l,0,.6)),fout=s.last?0:io(sg(l,s.dur-.6,s.dur));s.el.style.opacity=fin*(1-fout);s.el.style.transform=`translateY(${(1-fin)*30-fout*40}px)`;
    s.el.querySelectorAll('[data-a]').forEach(e=>{const a=+e.dataset.a,k=eo(sg(l,a,a+.7));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*60}px)`;
      if(e.dataset.type!==undefined){const tx=e.dataset.type,b=+e.dataset.b,p=cl((l-a)/(b-a));e.textContent=tx.slice(0,Math.ceil(p*tx.length));e.style.opacity=l>=a?1:0;e.style.transform='none'}
      if(e.dataset.strike){e.classList.toggle('strike',l>=+e.dataset.strike)}})})}
</script>
